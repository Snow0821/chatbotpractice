<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot</title>
  <style>
    :root {
      --bg: #f5f5f7; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
      --user: #0a84ff; --user-text: #ffffff; --bot: #e9e9ee; --border: #d2d2d7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111114; --panel: #1c1c1f; --text: #f2f2f7; --muted: #98989d;
        --user: #0a84ff; --user-text: #ffffff; --bot: #2c2c30; --border: #3a3a3e;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      display: flex; justify-content: center;
    }
    .app { width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column; background: var(--panel); }
    header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 17px; margin: 0; }
    header button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .error { align-self: center; color: #ff453a; font-size: 14px; }
    .empty { margin: auto; color: var(--muted); text-align: center; }
    .typing { color: var(--muted); }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
    textarea {
      flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
      font: inherit; background: var(--bg); color: var(--text); max-height: 160px;
    }
    form button { border: none; background: var(--user); color: var(--user-text); border-radius: 12px; padding: 0 18px; font: inherit; cursor: pointer; }
    form button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Chatbot</h1>
      <button id="reset" type="button">새 대화</button>
    </header>
    <div id="messages"><p class="empty">무엇이든 물어보세요.</p></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요 (Shift+Enter 줄바꿈)" required></textarea>
      <button id="send" type="submit">전송</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    let history = [];

    function addBubble(role, text) {
      messagesEl.querySelector(".empty")?.remove();
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    async function send(text) {
      history.push({ role: "user", content: text });
      addBubble("user", text);
      const pending = addBubble("assistant typing", "…");
      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "요청 실패 (" + res.status + ")");
        pending.className = "msg assistant";
        pending.textContent = data.reply || "(빈 응답)";
        history.push({ role: "assistant", content: data.reply || "" });
      } catch (err) {
        pending.remove();
        history.pop();
        addBubble("error", err.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      input.value = "";
      input.style.height = "";
      send(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });

    document.getElementById("reset").addEventListener("click", () => {
      history = [];
      messagesEl.innerHTML = '<p class="empty">무엇이든 물어보세요.</p>';
      input.focus();
    });
  </script>
</body>
</html>
